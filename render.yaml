services:
  - type: web
    name: agendapro-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
      - key: BILLING_PROVIDER
        value: play
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.turnia.app
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PUBSUB_RTDN_TOKEN
        sync: false
      - key: MAINTENANCE_TOKEN
        sync: false

  # Mantenimiento diario (reconciliacion con Play + apertura del mes).
  # Los cron jobs de Render NO existen en el plan gratuito: requieren plan
  # Starter. Descomenta este bloque al pasar a plan de pago, o usa el
  # endpoint POST /api/v1/internal/maintenance/daily con un cron externo.

